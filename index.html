<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#15120f">
<meta name="description" content="Imposter is a social bluffing party game: everyone gets a secret word except the imposter. Find the fake.">
<link rel="icon" href="data:,">
<title>Imposter — find the fake</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,700;1,600&display=swap');
:root{font-family:'DM Sans',sans-serif;color:#1a1511;background:#f4eee5;font-synthesis:none}
*{box-sizing:border-box}
body{margin:0;min-width:320px;background:radial-gradient(circle at 80% 15%,#e9cdb2 0,transparent 30%),#f4eee5;color:#1a1511}
button,input,select{font:inherit}
button{border:0;background:#1a1511;color:#fff;padding:16px 24px;border-radius:999px;font-weight:600;cursor:pointer}
button:disabled{opacity:.35;cursor:not-allowed}
.ghost{background:transparent;color:inherit;border:1px solid currentColor}
main{min-height:100vh;display:flex;flex-direction:column}
header{padding:22px clamp(18px,5vw,72px);display:flex;justify-content:space-between;align-items:center;font-size:13px;text-transform:uppercase;letter-spacing:.14em}
header .brand{font-weight:700;cursor:pointer}
header .helpbtn{background:transparent;color:inherit;border:1px solid currentColor;padding:8px 16px;font-size:12px;border-radius:999px}
.hero{padding:6vh clamp(22px,8vw,130px);position:relative;display:flex;flex-direction:column;justify-content:center;flex:1}
.spy{position:absolute;right:8%;top:10%;font-size:170px;opacity:.14;transform:rotate(8deg);pointer-events:none;user-select:none}
.eyebrow{text-transform:uppercase;letter-spacing:.18em;font-size:11px;color:#8b7f75}
h1.big{font-size:clamp(58px,10vw,140px);line-height:.85;letter-spacing:-.06em;margin:22px 0;position:relative}
h1.big em{font-family:'Playfair Display',serif;color:#bd3e29;font-weight:600}
.lead{font-size:clamp(17px,2vw,24px);max-width:600px;color:#655c55}
.actions{display:flex;gap:12px;margin-top:30px;flex-wrap:wrap}
.card{width:min(640px,calc(100% - 32px));margin:5vh auto;background:#fffaf3;padding:44px;border:1px solid #d8cbbd;box-shadow:12px 12px 0 #c8b9a8}
.card h2{font-size:clamp(34px,6vw,54px);letter-spacing:-.04em;line-height:.95;margin:0 0 8px}
.card h3{font-size:15px;text-transform:uppercase;letter-spacing:.12em;color:#8b7f75;margin:30px 0 10px}
.back{background:transparent;color:#1a1511;padding:0;font-size:14px;margin-bottom:18px}
.card label{display:block;font-size:13px;margin:18px 0;color:#655c55}
.card input[type=text],.card input:not([type]){width:100%;border:0;border-bottom:1px solid #a99b8e;background:transparent;padding:12px 0;font-size:19px;outline:none;color:#1a1511}
.card input::placeholder{color:#b7ab9e}
.card>button.wide{width:100%;margin-top:22px}
.row{display:flex;gap:10px;align-items:center}
.error{color:#a12e20;font-size:13px;margin-top:10px}
.note{font-size:13px;color:#8b7f75;margin-top:12px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.chip{padding:9px 15px;border-radius:999px;border:1px solid #c9bba9;background:#fff;font-size:14px;color:#1a1511;font-weight:500;cursor:pointer}
.chip.on{background:#1a1511;color:#fff;border-color:#1a1511}
.chip.small{padding:6px 11px;font-size:12px}
.seg{display:flex;border:1px solid #c9bba9;border-radius:999px;overflow:hidden;margin-top:8px}
.seg button{flex:1;background:#fff;color:#1a1511;border-radius:0;padding:12px 6px;font-size:13px;font-weight:600;border-left:1px solid #e5dccd}
.seg button:first-child{border-left:0}
.seg button.on{background:#1a1511;color:#fff}
.stepper{display:flex;align-items:center;gap:18px;margin-top:8px}
.stepper button{width:44px;height:44px;padding:0;border-radius:50%;font-size:20px}
.stepper b{font-size:26px;min-width:36px;text-align:center}
.plist{margin:10px 0}
.player{display:flex;align-items:center;border-top:1px solid #e0d6ca;padding:12px 0;gap:12px}
.player i{display:grid;place-items:center;width:38px;height:38px;background:#ddc6ad;border-radius:50%;font-style:normal;font-weight:700;color:#5b4632;flex:none}
.player span{flex:1;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.player small{background:#1a1511;color:#fff;padding:3px 8px;border-radius:4px;font-size:11px}
.player em{font-size:12px;color:#9b8f84;font-style:normal}
.player em.ready{color:#28794b}
.player button.x{background:transparent;color:#a12e20;padding:4px 8px;font-size:16px}
.share{display:flex;background:#1a1511;color:#f4eee5;padding:14px 18px;margin:26px 0;align-items:center;justify-content:space-between;border-radius:8px;gap:10px}
.share span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px}
.mini{padding:9px 15px;background:#bd3e29;font-size:12px;flex:none}
.bigcode{font-family:'Playfair Display',serif;font-size:56px;letter-spacing:.12em;margin:6px 0 0;color:#bd3e29}
.hostbar{position:sticky;bottom:16px;margin-top:24px;background:#bd3e29;color:#fff;padding:14px 18px;display:flex;justify-content:space-between;align-items:center;border-radius:12px;box-shadow:0 15px 50px #7c281d4d;gap:10px;flex-wrap:wrap}
.hostbar button{background:#fff;color:#1a1511;padding:12px 18px;font-size:14px}
.revealcard{width:min(480px,calc(100% - 32px));margin:8vh auto;text-align:center;background:#1a1511;color:#f4eee5;border-radius:22px;padding:56px 30px;position:relative;overflow:hidden}
.revealcard .word{font-family:'Playfair Display',serif;font-size:clamp(38px,9vw,58px);margin:20px 0;color:#e5aa74;overflow-wrap:anywhere}
.revealcard .imp{font-family:'Playfair Display',serif;font-size:clamp(34px,8vw,50px);margin:20px 0;color:#e0705a}
.revealcard .hint{font-size:19px;color:#d8c9ba;background:#2b241f;border-radius:10px;padding:16px;margin:18px 0}
.revealcard .sub{color:#a99b8d;font-size:15px}
.holdbtn{width:100%;padding:22px;font-size:17px;background:#bd3e29;border-radius:14px;user-select:none;-webkit-user-select:none;touch-action:manipulation}
.cluefeed{margin:16px 0}
.clue{display:flex;gap:12px;align-items:baseline;border-top:1px solid #e0d6ca;padding:10px 0}
.clue b{min-width:90px;color:#8b7f75;font-weight:600;font-size:13px}
.clue span{font-size:18px}
.votegrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.votegrid button{background:#fffaf3;color:#1a1511;border:1px solid #d8cbbd;border-radius:12px;padding:16px 10px;font-size:16px;font-weight:600}
.votegrid button.sel{background:#1a1511;color:#fff}
.resultcard{text-align:center;padding:30px 0}
.resultcard .verdict{font-family:'Playfair Display',serif;font-size:clamp(30px,7vw,46px);margin:14px 0}
.win{color:#28794b}.lose{color:#a12e20}
.lobby,.gscreen{width:min(860px,calc(100% - 32px));margin:4vh auto;flex:1}
.panel{background:#fffaf3;border:1px solid #d7c9bb;padding:26px;margin-top:20px}
.panel h3{margin-top:0}
.leavebtn{background:transparent;color:#8b3125;border:1px solid #8b3125;padding:9px 15px;font-size:12px}
.modal{position:fixed;inset:0;background:#1a1511cc;display:flex;align-items:center;justify-content:center;z-index:50;padding:18px}
.modal>div{background:#fffaf3;border-radius:16px;max-width:560px;width:100%;max-height:86vh;overflow:auto;padding:34px}
.modal h2{margin-top:0;letter-spacing:-.03em}
.modal li{margin:10px 0;line-height:1.45}
.modal .close{width:100%;margin-top:16px}
.loader{margin:auto;font-size:26px;padding:20vh 0;text-align:center}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:#1a1511;color:#fff;padding:12px 22px;border-radius:999px;font-size:14px;z-index:60;box-shadow:0 10px 30px #0006}
@media(max-width:640px){
 header{padding:16px 18px}
 .spy{font-size:96px}
 .card{padding:26px}
 .votegrid{grid-template-columns:1fr}
 .bigcode{font-size:44px}
 .actions{flex-direction:column}
 .actions button{width:100%}
}
</style>
</head>

function shuf(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

function normWord(s){return String(s||'').toLowerCase().trim().replace(/[^a-z0-9 ]/g,'').replace(/\s+/g,' ')}
function guessMatches(guess,word){
  const g=normWord(guess),w=normWord(word);
  if(!g)return false;
  if(g===w)return true;
  const strip=s=>s.split(' ').map(t=>t.length>3&&t.endsWith('s')?t.slice(0,-1):t).join(' ');
  return strip(g)===strip(w);
}
function makeHint(level,cat,word){
  if(level==='okay')return 'Broad hint: '+CATS[cat].b;
  if(level==='good')return 'Category: '+cat;
  const letters=normWord(word).replace(/ /g,'').length;
  const first=normWord(word).charAt(0).toUpperCase();
  return 'Category: '+cat+' · starts with '+first+' · '+letters+' letters';
}
/* pick a word the room hasn't seen; reshuffles a category only when it runs dry */
function pickWord(cats,used){
  const avail=cats.filter(c=>(CATS[c].w.length-(used[c]||[]).length)>0);
  const pool=avail.length?avail:cats;
  const cat=pick(pool);
  const seen=used[cat]||[];
  const fresh=CATS[cat].w.filter(w=>seen.indexOf(w)<0);
  const word=fresh.length?pick(fresh):pick(CATS[cat].w);
  if(!used[cat])used[cat]=[];
  if(used[cat].indexOf(word)<0)used[cat].push(word);
  return {cat:cat,word:word};
}

function freshLocal(){return {players:[],cats:defaultCats(),imposters:1,hint:'okay',used:{},round:0,assign:null,word:'',cat:'',revealIdx:0,accusedId:null,outcome:'',guess:''}}
function addLocalPlayer(name){
  const n=String(name||'').trim();if(!n)return;
  const L=S.local;
  if(L.players.length>=20){toast('Max 20 players');return}
  if(L.players.some(p=>p.name.toLowerCase()===n.toLowerCase())){toast('That name is taken');return}
  L.players.push({id:newUid(),name:n});
  if(L.imposters>imposterMax(L.players.length))L.imposters=imposterMax(L.players.length);
}
function startLocalRound(){
  const L=S.local;
  if(L.players.length<3){toast('Need at least 3 players');return}
  if(L.cats.length===0){toast('Pick a category');return}
  L.imposters=Math.min(Math.max(1,L.imposters),imposterMax(L.players.length));
  const w=pickWord(L.cats,L.used);
  L.word=w.word;L.cat=w.cat;L.round++;
  const impIds=new Set(shuf(L.players).slice(0,L.imposters).map(p=>p.id));
  L.assign={};
  for(const p of L.players){
    if(impIds.has(p.id))L.assign[p.id]={role:'imposter',hint:L.hint==='off'?'':makeHint(L.hint,w.cat,w.word)};
    else L.assign[p.id]={role:'crew',word:w.word};
  }
  L.revealIdx=0;L.accusedId=null;L.outcome='';L.guess='';
  S.screen='localReveal';render();
}
function localAccuse(id){
  const L=S.local;L.accusedId=id;
  const role=L.assign[id].role;
  if(role==='imposter'){S.screen='localGuess'}
  else {L.outcome='imposter';S.screen='localResult'}
  render();
}
function localGuess(){
  const L=S.local,g=(document.getElementById('in-guess')||{}).value||'';
  L.guess=g.trim();
  L.outcome=guessMatches(g,L.word)?'steal':'crew';
  S.screen='localResult';render();
}

  const f=await fbInit();
  const snap=await f.get(f.ref(f.db,'imposter/rooms/'+code));
  if(!snap.exists())throw new Error('No room with that code. Check the link or code and try again.');

  await f.set(f.ref(f.db,'imposter/rooms/'+code+'/players/'+f.uid),{name:name,joinedAt:Date.now()});

}

    const room=snap.val();
    if(!S.online)return;
    if(!room){handleRoomGone();return}
    S.online.room=room;
    if(!room.players||!room.players[S.online.uid]){handleRoomGone(true);return}
    S.online.isHost=room.hostId===S.online.uid;
    const ph=room.phase||'lobby';
    const map={lobby:'lobby',card:'card',clues:'clues',vote:'vote',guess:'guess',results:'results'};
    S.screen=map[ph]||'lobby';
    if(ph==='vote'&&S.online.isHost)maybeTally(room);
    if(ph==='guess'&&S.online.isHost&&room.guess)maybeScoreGuess(room);
    render();
  },()=>{toast('Connection hiccup — retrying');});
  const off2=f.onValue(f.ref(f.db,'imposter/secrets/'+code+'/'+S.online.uid),snap=>{
    if(S.online)S.online.secret=snap.val();
    render();
  },()=>{});
  S.online.unwatch=()=>{off1();off2()};
}
function unwatchOnline(){if(S.online&&S.online.unwatch){try{S.online.unwatch()}catch(e){}}}
function handleRoomGone(kicked){
  unwatchOnline();
  const wasIn=!!S.online;
  S.online=null;clearLocal();
  S.screen='home';
  if(wasIn)toast(kicked?'You are no longer in that room':'That room closed');
  render();
}
async function hostStartRound(){
  const o=S.online,f=F,room=o.room,code=o.code;
  const players=playerList(room);
  if(players.length<3){toast('Need at least 3 players');return}
  const st=onlineSettings(room);
  const imps=Math.min(Math.max(1,st.imposters),imposterMax(players.length));
  const used=room.usedWords||{};
  const w=pickWord(st.cats,used);
  const impIds=new Set(shuf(players).slice(0,imps).map(p=>p.id));
  const writes={};
  writes['imposter/rooms/'+code+'/phase']='card';
  writes['imposter/rooms/'+code+'/round']={num:((room.round&&room.round.num)||0)+1,cat:w.cat};
  writes['imposter/rooms/'+code+'/usedWords']=used;
  writes['imposter/rooms/'+code+'/clues']=null;
  writes['imposter/rooms/'+code+'/votes']=null;
  writes['imposter/rooms/'+code+'/ready']=null;
  writes['imposter/rooms/'+code+'/guess']=null;
  writes['imposter/rooms/'+code+'/voteNote']=null;
  writes['imposter/rooms/'+code+'/result']=null;
  for(const p of players){
    writes['imposter/secrets/'+code+'/'+p.id]=impIds.has(p.id)
      ?{role:'imposter',hint:st.hint==='off'?'':makeHint(st.hint,w.cat,w.word)}
      :{role:'crew',word:w.word};
  }
  await f.update(f.ref(f.db),writes);
}
async function maybeTally(room){
  const o=S.online;if(!o||o.tallying)return;
  const players=playerList(room);
  const votes=room.votes||{};
  const ids=Object.keys(votes).filter(v=>players.some(p=>p.id===v));
  if(ids.length<players.length)return;
  o.tallying=true;
  try{
    const counts={};
    for(const v of ids){const t=votes[v];if(players.some(p=>p.id===t))counts[t]=(counts[t]||0)+1}
    let max=0,tops=[];
    for(const t in counts){if(counts[t]>max){max=counts[t];tops=[t]}else if(counts[t]===max)tops.push(t)}
    const f=F,code=o.code;
    if(tops.length!==1){
      await f.update(f.ref(f.db),{['imposter/rooms/'+code+'/votes']:null,['imposter/rooms/'+code+'/voteNote']:'Tie vote — discuss and vote again.'});
      return;
    }
    const accused=tops[0];
    const accSnap=await f.get(f.ref(f.db,'imposter/secrets/'+code+'/'+accused));
    const sec=accSnap.val()||{};
    const accName=(room.players[accused]||{}).name||'?';
    if(sec.role==='imposter'){
      await f.update(f.ref(f.db),{['imposter/rooms/'+code+'/phase']:'guess',['imposter/rooms/'+code+'/result']:{accused:accused,accusedName:accName,wasImposter:true}});
    }else{
      const imps=[];
      const allSec=await f.get(f.ref(f.db,'imposter/secrets/'+code));
      const sv=allSec.val()||{};
      for(const id in sv)if(sv[id].role==='imposter')imps.push((room.players[id]||{}).name||'?');
      const wordSnap=await f.get(f.ref(f.db,'imposter/secrets/'+code+'/'+o.uid));
      const word=(wordSnap.val()||{}).word||'';
      await f.update(f.ref(f.db),{['imposter/rooms/'+code+'/phase']:'results',['imposter/rooms/'+code+'/result']:{accused:accused,accusedName:accName,wasImposter:false,outcome:'imposter',word:word,imposterNames:imps}});
    }
  }finally{o.tallying=false}
}
async function maybeScoreGuess(room){
  const o=S.online;if(!o||o.scoring)return;
  o.scoring=true;
  try{
    const f=F,code=o.code;
    const g=String(room.guess.text||'');
    const accUid=room.result.accused;
    const wordSnap=await f.get(f.ref(f.db,'imposter/secrets/'+code+'/'+o.uid));
    const word=(wordSnap.val()||{}).word||'';
    const ok=guessMatches(g,word);
    const allSec=await f.get(f.ref(f.db,'imposter/secrets/'+code));
    const sv=allSec.val()||{};
    const imps=[];
    for(const id in sv)if(sv[id].role==='imposter')imps.push((room.players[id]||{}).name||'?');
    await f.update(f.ref(f.db),{['imposter/rooms/'+code+'/phase']:'results',
      ['imposter/rooms/'+code+'/result/accused']:accUid,
      ['imposter/rooms/'+code+'/result/guess']:g,
      ['imposter/rooms/'+code+'/result/guessCorrect']:ok,
      ['imposter/rooms/'+code+'/result/outcome']:ok?'steal':'crew',
      ['imposter/rooms/'+code+'/result/word']:word,
      ['imposter/rooms/'+code+'/result/imposterNames']:imps});
  }finally{o.scoring=false}
}
async function leaveOnline(){
  const o=S.online;if(!o)return;
  const f=F,code=o.code,room=o.room;
  unwatchOnline();S.online=null;clearLocal();
  try{
    const players=playerList(room).filter(p=>p.id!==o.uid);
    const writes={};
    writes['imposter/rooms/'+code+'/players/'+o.uid]=null;
    writes['imposter/secrets/'+code+'/'+o.uid]=null;
    if(room&&room.hostId===o.uid&&players.length)writes['imposter/rooms/'+code+'/hostId']=players[0].id;
    if(players.length===0)writes['imposter/rooms/'+code]=null;
    await f.update(f.ref(f.db),writes);
  }catch(e){}
  S.screen='home';render();
}
function shareLink(code){return roomUrl(code)}
function copyLink(code){
  const url=shareLink(code);
  const done=()=>toast('Link copied');
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(url).then(done,()=>fallbackCopy(url,done))}
  else fallbackCopy(url,done);
}
function fallbackCopy(text,done){
  const ta=document.createElement('textarea');ta.value=text;document.body.appendChild(ta);ta.select();
  try{document.execCommand('copy');done()}catch(e){toast('Copy this link: '+text)}
  document.body.removeChild(ta);
}

function val(id){const e=document.getElementById(id);return e?e.value:''}
async function act(a,v){
  switch(a){
    case 'home':S.err='';if(S.online){if(!confirm('Leave this room?'))return;await leaveOnline();return}S.screen='home';render();break;
    case 'help':S.help=!S.help;render();break;
    case 'go-local':S.local=freshLocal();S.screen='localSetup';render();break;
    case 'go-online':S.err='';S.screen='hostSetup';render();break;
    case 'demo-players':['Alex','Sam','Jordan','Maya','Priya'].forEach(n=>addLocalPlayer(n));render();break;
    case 'add-player':addLocalPlayer(val('in-name'));render();setTimeout(()=>{const e=document.getElementById('in-name');if(e)e.focus()},0);break;
    case 'rm-player':S.local.players=S.local.players.filter(p=>p.id!==v);if(S.local.imposters>imposterMax(S.local.players.length))S.local.imposters=imposterMax(S.local.players.length);render();break;
    case 'tgl-cat':{const L=S.local,i=L.cats.indexOf(v);if(i>=0)L.cats.splice(i,1);else L.cats.push(v);render();break}
    case 'imp-minus':S.local.imposters=Math.max(1,S.local.imposters-1);render();break;
    case 'imp-plus':S.local.imposters=Math.min(imposterMax(S.local.players.length),S.local.imposters+1);render();break;
    case 'set-hint':S.local.hint=v;render();break;
    case 'start-local':startLocalRound();break;
    case 'to-vote':if(S.screen==='localDiscuss'){S.screen='localVote';render()}else{F.set(F.ref(F.db,'imposter/rooms/'+S.online.code+'/phase'),'vote')}break;
    case 'local-accuse':localAccuse(v);break;
    case 'local-guess':localGuess();break;
    case 'local-skip':S.local.outcome='crew';S.screen='localResult';render();break;
    case 'local-again':startLocalRound();break;
    case 'local-setup':S.screen='localSetup';render();break;
    case 'do-create':{
      const name=val('in-host-name').trim();
      if(!name){S.err='Enter your name first.';render();break}
      S.err='';render();
      try{
        const code=await createOnlineRoom(name,defaultCats(),1,'okay');
        S.online={code:code,uid:F.uid,name:name,isHost:true,room:null,secret:null};
        saveLocal({code:code,uid:F.uid,name:name});
        watchOnline(code);
      }catch(e){S.err='Could not create the room ('+(e&&e.message?e.message:'error')+'). Try again.';render()}
      break}
    case 'do-join':{
      const name=val('in-join-name').trim();
      if(!name){S.err='Enter your name first.';render();break}
      S.err='';render();
      try{
        await joinOnlineRoom(S.pendingCode,name);
        S.online={code:S.pendingCode,uid:F.uid,name:name,isHost:false,room:null,secret:null};
        saveLocal({code:S.pendingCode,uid:F.uid,name:name});
        watchOnline(S.pendingCode);
      }catch(e){S.err=e&&e.message?e.message:'Could not join.';render()}
      break}
    case 'copy':copyLink(S.online.code);break;
    case 'leave':await leaveOnline();break;
    case 'otgl-cat':{
      const st=onlineSettings(S.online.room);const i=st.cats.indexOf(v);
      if(i>=0){if(st.cats.length>1)st.cats.splice(i,1)}else st.cats.push(v);
      F.set(F.ref(F.db,'imposter/rooms/'+S.online.code+'/settings/cats'),st.cats);break}
    case 'oimp-minus':case 'oimp-plus':{
      const st=onlineSettings(S.online.room);const n=playerList(S.online.room).length;
      let c=st.imposters+(a==='oimp-plus'?1:-1);
      c=Math.min(Math.max(1,c),imposterMax(n));
      F.set(F.ref(F.db,'imposter/rooms/'+S.online.code+'/settings/imposters'),c);break}
    case 'oset-hint':F.set(F.ref(F.db,'imposter/rooms/'+S.online.code+'/settings/hint'),v);break;
    case 'ostart':try{await hostStartRound()}catch(e){toast('Could not start: '+(e&&e.message?e.message:'error'))}break;
    case 'ready':F.set(F.ref(F.db,'imposter/rooms/'+S.online.code+'/ready/'+S.online.uid),!(S.online.room.ready&&S.online.room.ready[S.online.uid]));break;
    case 'to-clues':F.set(F.ref(F.db,'imposter/rooms/'+S.online.code+'/phase'),'clues');break;
    case 'send-clue':{
      const c=val('in-clue').trim();
      if(!c){toast('Type a clue first');break}
      F.set(F.ref(F.db,'imposter/rooms/'+S.online.code+'/clues/'+S.online.uid),c);break}
    case 'cast-vote':F.set(F.ref(F.db,'imposter/rooms/'+S.online.code+'/votes/'+S.online.uid),v);break;
    case 'force-tally':{
      const room=S.online.room,players=playerList(room);
      const votes=Object.assign({},room.votes||{});
      for(const p of players)if(!votes[p.id])votes[p.id]=p.id===S.online.uid?(players.find(x=>x.id!==p.id)||{}).id:votes[p.id];
      await F.set(F.ref(F.db,'imposter/rooms/'+S.online.code+'/votes'),votes);
      maybeTally(S.online.room);break}
    case 'send-oguess':{
      const g=val('in-oguess').trim();
      if(!g){toast('Type a guess first');break}
      F.set(F.ref(F.db,'imposter/rooms/'+S.online.code+'/guess'),{text:g,by:S.online.uid});break}
    case 'pass-guess':F.set(F.ref(F.db,'imposter/rooms/'+S.online.code+'/guess'),{text:'',by:'host-pass'});break;
    case 'to-lobby':F.update(F.ref(F.db),{['imposter/rooms/'+S.online.code+'/phase']:'lobby',['imposter/rooms/'+S.online.code+'/result']:null});break;
  }
}

  if(e.key!=='Enter')return;
  const id=e.target&&e.target.id;
  if(id==='in-name')act('add-player');
  else if(id==='in-guess')act('local-guess');
  else if(id==='in-host-name')act('do-create');
  else if(id==='in-join-name')act('do-join');
  else if(id==='in-clue')act('send-clue');
  else if(id==='in-oguess')act('send-oguess');
});
/* hold-to-reveal (works for local + online cards) */
document.addEventListener('pointerdown',e=>{
  if(e.target.id!=='hold')return;
  const cv=document.getElementById('cardview');if(cv)cv.style.display='block';
});
['pointerup','pointercancel','pointerleave'].forEach(ev=>document.addEventListener(ev,e=>{
  const cv=document.getElementById('cardview');if(cv&&e.target.id==='hold')cv.style.display='none';
}));
/* local reveal: after hiding, advance button */
document.addEventListener('click',e=>{
  if(e.target.id==='next-reveal'){
    const L=S.local;
    if(L.revealIdx<L.players.length-1){L.revealIdx++;render()}
    else{S.screen='localDiscuss';render()}
  }
});
/* ============ BOOT ============ */
async function tryResume(code,name){
  await fbInit();
  const snap=await F.get(F.ref(F.db,'imposter/rooms/'+code));
  if(!snap.exists())return false;
  const r=snap.val();
  if(!r.players||!r.players[F.uid])return false;
  S.online={code:code,uid:F.uid,name:(r.players[F.uid].name)||name||'',isHost:r.hostId===F.uid,room:null,secret:null};
  saveLocal({code:code,uid:F.uid,name:S.online.name});
  watchOnline(code);
  return true;
}
async function boot(){
  S.screen='boot';render();
  const params=new URLSearchParams(location.search);
  const room=(params.get('room')||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
  const saved=loadLocal();
  if(room){
    if(saved&&saved.code===room){
      try{if(await tryResume(room,saved.name))return}catch(e){}
    }
    S.pendingCode=room;S.err='';S.screen='join';render();
    return;
  }
  if(saved&&saved.code){
    try{if(await tryResume(saved.code,saved.name))return}catch(e){}
    clearLocal();
  }
  S.screen='home';render();
}
boot();
</script>
